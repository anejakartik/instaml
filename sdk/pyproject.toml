[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instaml"
version = "0.1.0a0"
description = "Real-time feature store for startups — YAML feature defs, online+offline dual-write, Python SDK."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kartik Aneja", email = "anejakartik68@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["instaml*"]
