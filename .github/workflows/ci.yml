name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.10 pytest
          pip install -e ./sdk
          pip install -r server/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          PYTHONPATH=./sdk:./server pytest -v tests/
